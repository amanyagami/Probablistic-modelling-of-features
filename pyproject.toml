[project]
name = "featprob"
version = "0.1.0"
description = "Probabilistic modelling of deep features: class-conditional GMMs, OOD scoring and visualisation helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
viz = ["umap-learn>=0.5.5"]
opentsne = ["openTSNE>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "nbstripout>=0.7",
    "jupytext>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/featprob"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"notebooks/*" = ["D", "E402", "E501"]
